[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "breany522-citetrace"
version = "0.1.0"
description = "把候选项映射到类别上，算出提示词里的引用来源的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "breany522" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://breany522.github.io"
Repository = "https://github.com/breany522/citetrace"
Issues = "https://github.com/breany522/citetrace/issues"

[project.scripts]
citetrace = "citetrace:main"

[tool.setuptools]
py-modules = ["citetrace"]
